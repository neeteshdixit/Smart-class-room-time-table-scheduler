<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password | ITM University</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700;900&family=Source+Sans+3:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div class="page-shell d-flex align-items-center">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-md-6 col-lg-5">
            <div class="card form-card">
              <div class="card-body p-4 p-md-5">
                <h3 class="mb-2">Reset Password</h3>
                <p class="text-secondary mb-1">Set your new password.</p>
                <p id="resetPasswordEmail" class="small text-muted mb-3"></p>
                <div id="resetPasswordAlert" class="alert alert-danger alert-inline"></div>
                <form id="resetPasswordForm" class="row g-3">
                  <div class="col-12">
                    <label class="form-label">New Password</label>
                    <input type="password" name="new_password" class="form-control" minlength="8" required />
                  </div>
                  <div class="col-12">
                    <label class="form-label">Confirm Password</label>
                    <input
                      type="password"
                      name="confirm_password"
                      class="form-control"
                      minlength="8"
                      required
                    />
                  </div>
                  <div class="col-12 d-grid">
                    <button id="resetPasswordBtn" type="submit" class="btn btn-warning">
                      Reset Password
                    </button>
                  </div>
                </form>
                <div class="mt-3">
                  <a href="/login.html" class="small">Back to login</a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="/js/common.js"></script>
    <script src="/js/reset-password.js"></script>
  </body>
</html>
