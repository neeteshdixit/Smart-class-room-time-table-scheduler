<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login | ITM University</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700;900&family=Source+Sans+3:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div class="page-shell d-flex align-items-center">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-md-6 col-lg-5">
            <div class="card form-card">
              <div class="card-body p-4 p-md-5">
                <h3 class="mb-2">Admin Login</h3>
                <p class="text-secondary">Only admin accounts can login to manage timetable data.</p>
                <div id="loginAlert" class="alert alert-danger alert-inline"></div>
                <form id="loginForm" class="row g-3">
                  <div class="col-12">
                    <label class="form-label">Email or Faculty ID</label>
                    <input
                      type="text"
                      name="identifier"
                      class="form-control"
                      placeholder="Enter email or faculty ID"
                      required
                    />
                  </div>
                  <div class="col-12">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" required />
                  </div>
                  <div class="col-12 text-end mt-0">
                    <a href="/forgot-password.html" class="small">Forgot Password?</a>
                  </div>
                  <div class="col-12 d-grid">
                    <button id="loginBtn" type="submit" class="btn btn-warning">Login</button>
                  </div>
                </form>
                <div class="mt-3 d-flex justify-content-between">
                  <a href="/" class="small">Back to landing</a>
                  <a href="/signup.html" class="small">Faculty registration</a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="/runtime-config.js"></script>
    <script src="/js/common.js"></script>
    <script src="/js/login.js"></script>
  </body>
</html>
