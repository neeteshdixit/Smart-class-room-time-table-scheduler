<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verify Reset OTP | ITM University</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700;900&family=Source+Sans+3:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div class="page-shell d-flex align-items-center">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-md-5 col-lg-4">
            <div class="card form-card">
              <div class="card-body p-4">
                <h4 class="mb-2">Verify OTP</h4>
                <p class="text-secondary small mb-1">Enter the OTP sent to your registered email.</p>
                <p id="otpEmailHint" class="small text-muted mb-3"></p>
                <p id="resetOtpPreview" class="small text-primary fw-semibold"></p>
                <div id="forgotOtpAlert" class="alert alert-danger alert-inline"></div>
                <form id="forgotOtpForm" class="row g-3">
                  <div class="col-12">
                    <label class="form-label">OTP</label>
                    <input
                      type="text"
                      name="otp"
                      class="form-control form-control-lg text-center"
                      maxlength="6"
                      pattern="[0-9]{6}"
                      required
                    />
                  </div>
                  <div class="col-12 d-grid">
                    <button id="verifyResetOtpBtn" type="submit" class="btn btn-warning">Verify OTP</button>
                  </div>
                </form>
                <div class="d-flex justify-content-between mt-3">
                  <a href="/forgot-password.html" class="small">Change identifier</a>
                  <button id="resendResetOtpBtn" class="btn btn-link btn-sm p-0">Resend OTP</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="/js/common.js"></script>
    <script src="/js/forgot-otp.js"></script>
  </body>
</html>
