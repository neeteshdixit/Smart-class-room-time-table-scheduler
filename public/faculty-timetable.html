<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Faculty Timetable | Timetable Scheduler</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700;900&family=Source+Sans+3:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark navbar-university sticky-top">
      <div class="container-fluid px-3 px-md-4">
        <a class="navbar-brand d-flex align-items-center gap-2" href="/faculty-timetable.html">
          <span class="brand-mark">ITM</span>
          <span>Faculty Timetable</span>
        </a>
        <div class="ms-auto d-flex gap-2">
          <a href="/profile.html" class="btn btn-outline-light btn-sm">Profile</a>
          <button data-logout-button type="button" class="btn btn-warning btn-sm">Logout</button>
        </div>
      </div>
    </nav>

    <main class="container-fluid px-3 px-md-4 py-4">
      <div id="facultyTimetableAlert" class="alert alert-danger alert-inline"></div>

      <div class="card section-card mb-4">
        <div class="card-body">
          <div class="d-flex flex-wrap align-items-center justify-content-between gap-3">
            <div>
              <h5 class="mb-1">My Timetable</h5>
              <p id="facultyIdentity" class="text-secondary small mb-0"></p>
            </div>
            <div class="d-flex align-items-center gap-2">
              <label for="facultyTimetableSelect" class="form-label mb-0">Version</label>
              <select id="facultyTimetableSelect" class="form-select form-select-sm"></select>
            </div>
          </div>
        </div>
      </div>

      <div class="card section-card">
        <div class="card-body">
          <div id="facultyGridHeader" class="text-center mb-3"></div>
          <div id="facultyGridContainer" class="table-responsive"></div>
          <div id="facultyGridFooter" class="d-flex justify-content-between mt-2 small text-secondary"></div>
        </div>
      </div>

      <div class="card section-card mt-4">
        <div class="card-body">
          <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-3">
            <div>
              <h5 class="mb-1">Student Timetable</h5>
              <p class="text-secondary small mb-0">View a section timetable, download the PDF, or share it with student groups.</p>
            </div>
            <div class="d-flex flex-wrap align-items-center gap-2">
              <label for="studentTimetableSelect" class="form-label mb-0">Version</label>
              <select id="studentTimetableSelect" class="form-select form-select-sm"></select>
              <label for="studentSectionSelect" class="form-label mb-0">Section</label>
              <select id="studentSectionSelect" class="form-select form-select-sm"></select>
              <button id="studentDownloadBtn" type="button" class="btn btn-outline-primary btn-sm">Download PDF</button>
              <button id="studentShareBtn" type="button" class="btn btn-outline-success btn-sm">Share</button>
            </div>
          </div>
          <div id="studentGridHeader" class="text-center mb-3"></div>
          <div id="studentGridContainer" class="table-responsive"></div>
          <div id="studentGridFooter" class="d-flex justify-content-between mt-2 small text-secondary"></div>
        </div>
      </div>

      <div class="card section-card mt-4 d-none" id="mentorTimetableCard">
        <div class="card-body">
          <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-3">
            <div>
              <h5 class="mb-1">Mentor Timetable</h5>
              <p class="text-secondary small mb-0">Section timetable access is available only for your mentor-assigned sections.</p>
            </div>
            <div class="d-flex flex-wrap align-items-center gap-2">
              <label for="mentorSectionSelect" class="form-label mb-0">Section</label>
              <select id="mentorSectionSelect" class="form-select form-select-sm"></select>
              <label for="mentorTimetableSelect" class="form-label mb-0">Version</label>
              <select id="mentorTimetableSelect" class="form-select form-select-sm"></select>
            </div>
          </div>
          <div id="mentorGridHeader" class="text-center mb-3"></div>
          <div id="mentorGridContainer" class="table-responsive"></div>
          <div id="mentorGridFooter" class="d-flex justify-content-between mt-2 small text-secondary"></div>
        </div>
      </div>
    </main>

    <script src="/runtime-config.js"></script>
    <script src="/js/common.js"></script>
    <script src="/js/faculty-timetable.js"></script>
  </body>
</html>
