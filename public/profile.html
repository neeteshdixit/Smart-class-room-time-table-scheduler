<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Faculty Profile | Timetable Scheduler</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700;900&family=Source+Sans+3:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <nav class="navbar navbar-dark navbar-university">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2" href="/dashboard.html">
          <span class="brand-mark">ITM</span>
          <span>Faculty Profile</span>
        </a>
        <div>
          <a href="/dashboard.html" class="btn btn-outline-light btn-sm me-2">Dashboard</a>
          <button id="profileLogoutBtn" data-logout-button type="button" class="btn btn-warning btn-sm">Logout</button>
        </div>
      </div>
    </nav>

    <main class="container py-4 py-md-5">
      <div class="row justify-content-center">
        <div class="col-lg-9">
          <div class="card form-card">
            <div class="card-body p-4 p-md-5">
              <h3 class="mb-2">Profile Management</h3>
              <p class="text-secondary">View and update your account details.</p>
              <div id="profileAlert" class="alert alert-danger alert-inline"></div>

              <form id="profileForm" class="row g-3">
                <div class="col-md-4">
                  <label class="form-label">Faculty ID</label>
                  <input class="form-control" name="faculty_id" disabled />
                </div>
                <div class="col-md-8">
                  <label class="form-label">Full Name</label>
                  <input class="form-control" name="full_name" required />
                </div>
                <div class="col-md-4">
                  <label class="form-label">Department</label>
                  <input class="form-control" name="department" required />
                </div>
                <div class="col-md-4">
                  <label class="form-label">Designation</label>
                  <input class="form-control" name="designation" required />
                </div>
                <div class="col-md-4">
                  <label class="form-label">Role</label>
                  <input class="form-control" name="role" />
                </div>
                <div class="col-md-4">
                  <label class="form-label">Email</label>
                  <input type="email" class="form-control" name="email" required />
                </div>
                <div class="col-md-4">
                  <label class="form-label">Mobile Number</label>
                  <input class="form-control" name="mobile_number" required />
                </div>
                <div class="col-md-4">
                  <label class="form-label">Gender</label>
                  <input class="form-control" name="gender" />
                </div>
                <div class="col-md-4">
                  <label class="form-label">Date of Birth</label>
                  <input type="date" class="form-control" name="dob" />
                </div>
                <div class="col-md-4">
                  <label class="form-label">Qualification</label>
                  <input class="form-control" name="qualification" />
                </div>
                <div class="col-md-4">
                  <label class="form-label">Experience (Years)</label>
                  <input type="number" step="0.1" min="0" class="form-control" name="experience_years" />
                </div>
                <div class="col-md-8">
                  <label class="form-label">Address</label>
                  <input class="form-control" name="address" />
                </div>
                <div class="col-md-4">
                  <label class="form-label">Joining Date</label>
                  <input type="date" class="form-control" name="joining_date" />
                </div>
                <div class="col-md-4">
                  <label class="form-label">Employee Type</label>
                  <input class="form-control" name="employee_type" />
                </div>
                <div class="col-md-4">
                  <label class="form-label">Office Location</label>
                  <input class="form-control" name="office_location" />
                </div>
                <div class="col-md-4">
                  <label class="form-label">Profile Photo URL</label>
                  <input class="form-control" name="profile_photo_url" />
                </div>
                <div class="col-12 d-grid d-md-flex justify-content-md-end">
                  <button id="saveProfileBtn" type="submit" class="btn btn-warning px-4">Save Changes</button>
                </div>
              </form>

              <hr class="my-4" />

              <section class="danger-zone">
                <h5 class="text-danger mb-2">Delete Account</h5>
                <p class="text-secondary mb-3">
                  This permanently deletes your account and signs you out immediately.
                </p>
                <form id="deleteAccountForm" class="row g-3">
                  <div class="col-md-6">
                    <label class="form-label">Confirm Password</label>
                    <input
                      type="password"
                      class="form-control"
                      id="deletePassword"
                      name="password"
                      required
                    />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Re-enter Password</label>
                    <input
                      type="password"
                      class="form-control"
                      id="deleteConfirmPassword"
                      name="confirm_password"
                      required
                    />
                  </div>
                  <div class="col-12 d-grid d-md-flex justify-content-md-end">
                    <button id="deleteAccountBtn" type="submit" class="btn btn-outline-danger px-4">
                      Delete Account
                    </button>
                  </div>
                </form>
              </section>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="/runtime-config.js"></script>
    <script src="/js/common.js"></script>
    <script src="/js/profile.js"></script>
  </body>
</html>
