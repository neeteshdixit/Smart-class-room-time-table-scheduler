<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Faculty Signup | ITM University</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700;900&family=Source+Sans+3:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <nav class="navbar navbar-dark navbar-university">
        <div class="container">
          <a class="navbar-brand d-flex align-items-center gap-2" href="/">
            <span class="brand-mark">ITM</span>
            <span>User Registration</span>
          </a>
          <a href="/login.html" class="btn btn-warning btn-sm">Admin Login</a>
        </div>
      </nav>

      <main class="container py-4 py-md-5">
        <div class="row justify-content-center">
          <div class="col-xl-10">
            <div class="card form-card">
              <div class="card-body p-4 p-md-5">
                <h2 class="mb-3">Create Account</h2>
                <p class="text-secondary">Upload photo, choose role, and select departments and subjects.</p>
                <div id="signupAlert" class="alert alert-danger alert-inline"></div>
                <form id="signupForm" class="row g-3" enctype="multipart/form-data">
                  <div class="col-md-4">
                    <label class="form-label">Faculty ID *</label>
                    <input type="text" class="form-control" name="faculty_id" required />
                  </div>
                  <div class="col-md-4">
                    <label class="form-label">Full Name *</label>
                    <input type="text" class="form-control" name="full_name" required />
                  </div>
                  <div class="col-md-8">
                    <label class="form-label">Departments * (Ctrl/Cmd for multiple)</label>
                    <select class="form-select" name="department_ids" id="departmentSelect" size="4" multiple></select>
                  </div>
                  <div class="col-md-4">
                    <label class="form-label">Designation *</label>
                    <input type="text" class="form-control" name="designation" required />
                  </div>
                  <div class="col-md-4">
                    <label class="form-label">Email *</label>
                    <input type="email" class="form-control" name="email" required />
                  </div>
                  <div class="col-md-4">
                    <label class="form-label">Mobile Number *</label>
                    <input type="tel" class="form-control" name="mobile_number" pattern="[0-9]{10,15}" required />
                  </div>
                  <div class="col-md-4">
                    <label class="form-label">Password *</label>
                    <input type="password" class="form-control" name="password" minlength="8" required />
                  </div>
                  <div class="col-md-4">
                    <label class="form-label">Confirm Password *</label>
                    <input type="password" class="form-control" name="confirm_password" minlength="8" required />
                  </div>
                  <div class="col-md-4">
                    <label class="form-label">Gender *</label>
                    <select class="form-select" name="gender" required>
                      <option value="">Select</option>
                      <option>Male</option>
                      <option>Female</option>
                      <option>Other</option>
                    </select>
                  </div>
                  <div class="col-md-4">
                    <label class="form-label">Date of Birth *</label>
                    <input type="date" class="form-control" name="dob" required />
                  </div>
                  <div class="col-md-4">
                    <label class="form-label">Qualification *</label>
                    <input type="text" class="form-control" name="qualification" required />
                  </div>
                  <div class="col-md-4">
                    <label class="form-label">Experience (Years) *</label>
                    <input type="number" step="0.1" min="0" class="form-control" name="experience_years" required />
                  </div>
                  <div class="col-md-8">
                    <label class="form-label">Address *</label>
                    <input type="text" class="form-control" name="address" required />
                  </div>
                  <div class="col-md-4">
                    <label class="form-label">Joining Date *</label>
                    <input type="date" class="form-control" name="joining_date" required />
                  </div>
                  <div class="col-md-4">
                    <label class="form-label">Profile Photo</label>
                    <input type="file" class="form-control" name="profile_photo" accept="image/*" />
                  </div>
                  <div class="col-md-4">
                    <label class="form-label">Role *</label>
                    <select class="form-select" name="role" id="roleSelect" required>
                      <option value="FACULTY">FACULTY</option>
                      <option value="ADMIN" id="adminRoleOption">ADMIN</option>
                    </select>
                    <small id="adminRoleHelp" class="text-secondary d-block mt-1"></small>
                  </div>
                  <div class="col-md-4">
                    <label class="form-label">Subjects Taught * (Ctrl/Cmd for multiple)</label>
                    <select class="form-select" name="subject_ids" id="subjectSelect" size="4" multiple></select>
                    <small id="subjectCountHelp" class="text-secondary d-block mt-1">Selected subjects: 0</small>
                  </div>
                  <div class="col-md-4">
                    <label class="form-label">Employee Type</label>
                    <select class="form-select" name="employee_type">
                      <option value="Permanent">Permanent</option>
                      <option value="Visiting">Visiting</option>
                    </select>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Office Location / Cabin</label>
                    <input type="text" class="form-control" name="office_location" />
                  </div>
                  <div class="col-12 d-grid d-md-flex justify-content-md-end gap-2 pt-2">
                    <a href="/" class="btn btn-outline-secondary">Back</a>
                    <button id="signupBtn" type="submit" class="btn btn-warning px-4">Register</button>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script src="/js/common.js"></script>
    <script src="/js/signup.js"></script>
  </body>
</html>
